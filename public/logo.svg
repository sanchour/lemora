<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Lemora: a bookmark and a full stop, the place you pause in a book</title>
  <!-- One file for the tab and the desktop: its colours follow the system's light. The PNGs are drawn from the light ones. -->
  <style>
    .b0 { stop-color: #FCF8F1; } .b1 { stop-color: #EFE3CF; } .ink { fill: #3B302A; } .fold { fill: #6A584C; } .dot { fill: #C86D51; } .line { stroke: #3B302A; }
    @media (prefers-color-scheme: dark) { .b0 { stop-color: #2D2724; } .b1 { stop-color: #191513; } .ink { fill: #EBE0CC; } .fold { fill: #BFB29C; } .dot { fill: #D49B54; } .line { stroke: #EBE0CC; } }
  </style>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="b0" stop-color="#FCF8F1"/><stop offset="1" class="b1" stop-color="#EFE3CF"/></linearGradient>
    <clipPath id="t"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#b)"/>
  <g clip-path="url(#t)">
    <path class="ink" d="M196 -4H264V346L230 314L196 346Z" fill="#3B302A"/>
    <path class="fold" d="M196 -4H218V324L196 346Z" fill="#6A584C" opacity=".5"/>
    <circle class="dot" cx="334" cy="314" r="34" fill="#C86D51"/>
    <path class="line" d="M140 392Q256 384 372 392" fill="none" stroke="#3B302A" stroke-width="9" stroke-linecap="round" opacity=".22"/>
  </g>
</svg>
